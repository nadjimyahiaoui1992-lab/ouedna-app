name: souf_tour
description: Souf 360 - الدليل السياحي الذكي لولاية وادي سوف (Wadi Souf).
publish_to: "none"
version: 1.5.0+16

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.4.0
  geolocator: ^13.0.4
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  http: ^1.2.2
  image_picker: ^1.1.2
  app_links: 6.3.3
  speech_to_text: 6.6.2

dependency_overrides:
  geolocator_android: 4.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/souf360_el_oued_welcome.jpg
    - assets/branding/souf360_oasis_sunset.jpg
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
