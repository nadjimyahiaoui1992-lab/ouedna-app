name: souf_tour
description: وادنا - الدليل السياحي الذكي لولاية وادي سوف (Wadi Souf).
publish_to: "none"
version: 1.8.0+23

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.4.0
  geolocator: ^13.0.4
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  http: ^1.2.2
  image_picker: ^1.1.2
  app_links: 6.3.3
  speech_to_text: 6.6.2
  permission_handler: ^11.3.1
  open_filex: ^4.6.0
  package_info_plus: ^8.1.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  google_mlkit_translation: ^0.13.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

dependency_overrides:
  geolocator_android: 4.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/icon.png
    - assets/branding/welcome_bg.jpg
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
