name: souf_tour
description: A new Souf Tour application for El Oued tourism.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.12.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^0.3.3
  cached_network_image: ^3.2.3
  flutter_map: ^3.1.0
  latlong2: ^0.8.2
  url_launcher: ^6.1.11
  shared_preferences: ^2.1.0
  share_plus: ^7.1.0
  geolocator: ^9.0.2
  flutter_staggered_grid_view: ^0.7.0
  cupertino_icons: ^1.0.2
  font_awesome_flutter: ^9.0.0

dependency_overrides:
  uni_links: ^0.5.1
  uni_links_platform_interface: ^1.0.0
  uni_links_web: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
   - lib/assets/images/
