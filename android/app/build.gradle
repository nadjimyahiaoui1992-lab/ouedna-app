plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

android {
    namespace 'com.souf360.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.souf360.app'
        minSdk flutter.minSdkVersion
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName

        // Google Play devices only. Emulator ABIs are deliberately excluded.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 and resource shrinking are enabled for Play Store builds.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Never silently sign a release with the Android debug certificate.
            // Without the owner-controlled keystore, Gradle produces no signed
            // Play Store artifact; the signing guide explains the next step.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('Release signing is not configured. Add android/key.properties and the owner-controlled upload keystore before publishing to Google Play.')
            }
        }
    }
}

flutter {
    source '../..'
}

// A Play Store artifact must never be produced unsigned or with the debug key.
// Debug builds remain available for local development and automated checks.
if (!hasReleaseKeystore) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { task ->
            task.path.endsWith(':bundleRelease') || task.path.endsWith(':assembleRelease')
        }) {
            throw new GradleException('Release signing is required. Add android/key.properties and the owner-controlled upload keystore before building a Play Store artifact.')
        }
    }
}
