name: Android quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enforce formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze source
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build verification APK
        run: flutter build apk --debug --flavor direct

      - name: Upload APK and coverage
        uses: actions/upload-artifact@v4
        with:
          name: souf-tour-debug-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-direct-debug.apk
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
