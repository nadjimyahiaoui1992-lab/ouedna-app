name: Publish Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de version existant à publier, par exemple v2.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      OUEDNA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      OUEDNA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      OUEDNA_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      OUEDNA_KEYSTORE_PATH: ${{ github.workspace }}/android/app/ouedna-release.jks
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Validate release secrets
        run: |
          missing=()
          for secret in \
            ANDROID_KEYSTORE_BASE64 \
            GOOGLE_SERVICES_JSON_BASE64 \
            OUEDNA_KEY_ALIAS \
            OUEDNA_KEY_PASSWORD \
            OUEDNA_STORE_PASSWORD \
            SUPABASE_URL \
            SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Restore Android signing key
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$OUEDNA_KEYSTORE_PATH"
          test -s "$OUEDNA_KEYSTORE_PATH"
          chmod 600 "$OUEDNA_KEYSTORE_PATH"

      - name: Restore Firebase Android configuration
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
          chmod 600 android/app/google-services.json

      - name: Resolve dependencies and test
        run: |
          flutter pub get
          dart format --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build signed direct APK by ABI
        run: >-
          flutter build apk --flavor direct --release --split-per-abi
          --target-platform android-arm,android-arm64
          --dart-define=OUEDNA_DIRECT_BUILD=true
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Build signed Play Store bundle
        run: >-
          flutter build appbundle --flavor play --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify release signatures
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/playRelease/*.aab
